; Halyard's firmware. lib/halyard is portable C++ (no Arduino); src/ is the ESP32 glue:
; WiFi, esp_http_server (HTTP + websocket, Mainsail from the card, OTA) and the USB console.
[platformio]
default_envs = geek

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall
lib_deps = bblanchon/ArduinoJson@7.4.2

; Waveshare ESP32-S3-GEEK: ESP32-S3R2 (2 MB quad PSRAM), 16 MB quad flash.
[env:geek]
; pioarduino: Arduino-ESP32 3.3.12 on ESP-IDF 5.5.5 (official PlatformIO stops at Arduino 2.0).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
extra_scripts = pre:version.py
test_ignore = *

; Host unit tests against a simulated Marlin: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -g -fsanitize=address,undefined -lz  ; zlib checks zip_tar's gzip
build_src_filter = -<*>
extra_scripts = post:asan_link.py
